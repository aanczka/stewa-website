---
layout: default
---
<header class="page-hero">
  <div class="container">
    <p class="eyebrow">{{ page.eyebrow | default: site.project.acronym }}</p>
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif -%}
  </div>
</header>
<div class="container prose-wrap">
  <div class="prose{% if page.wide %} prose--wide{% endif %}">{{ content }}</div>
</div>
